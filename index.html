<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181A">
<meta name="mobile-web-app-capable" content="yes">
<title>Training Log</title>
<style>
:root{
  --ground:#16181A; --card:#212427; --field:#2A2E32; --line:#3A4046; --line-soft:#2E3337;
  --text:#EDEFF1; --muted:#939BA2; --accent:#E3A54A; --accent-ink:#16181A;
  --logged:#6FBF8B; --warn:#E0705C;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:640px; margin:0 auto; padding:20px 16px 56px; display:flex; flex-direction:column; gap:14px}

header{display:flex; flex-direction:column; gap:4px}
.eyebrow{font-size:.72rem; text-transform:uppercase; letter-spacing:.11em; color:var(--accent); font-weight:600}
h1{font-size:1.5rem; font-weight:650; margin:0; letter-spacing:-.02em; text-wrap:balance}
.progress{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
.progress b{color:var(--text); font-weight:600}

.card{background:var(--card); border:1px solid var(--line-soft); border-radius:12px; padding:16px}
h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 12px; font-weight:600}
.session-note{font-size:.88rem; color:var(--muted); margin:0; line-height:1.5}

.days{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px}
.days button{
  appearance:none; flex:0 0 auto; background:var(--field); color:var(--text);
  border:1px solid var(--line); border-radius:999px; padding:9px 16px;
  min-height:44px; font-size:.9rem; font-family:var(--sans); cursor:pointer;
}
.days button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:650}

.rdy{display:flex; flex-direction:column; gap:12px}
.rdy-row{display:flex; flex-direction:column; gap:6px}
.rdy-row span{font-size:.9rem}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.scale button{
  appearance:none; background:var(--field); color:var(--text); border:1px solid var(--line);
  border-radius:8px; min-height:44px; font-size:1rem; font-family:var(--mono); cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
}
.scale button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}

.ex-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px}
.ex-head h3{margin:0; font-size:1.05rem; font-weight:600; letter-spacing:-.01em}
.target{font-size:.82rem; color:var(--accent); font-family:var(--mono); white-space:nowrap}
.cue{font-size:.82rem; color:var(--muted); margin:0 0 12px; line-height:1.45}

.col-head{display:grid; grid-template-columns:26px 1fr 1fr; gap:8px; margin-bottom:6px}
.col-head span{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.col-head span:first-child{text-align:center}
.sets{display:flex; flex-direction:column; gap:8px}
.set{display:grid; grid-template-columns:26px 1fr 1fr; gap:8px; align-items:center}
.set-n{font-family:var(--mono); font-size:.85rem; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
.set.done .set-n{color:var(--logged); font-weight:700}
.field{position:relative; display:flex; align-items:center}
.field input{
  width:100%; min-height:44px; padding:8px 34px 8px 10px;
  background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:8px;
  font-size:16px; font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.field .unit{position:absolute; right:10px; font-size:.75rem; color:var(--muted); pointer-events:none}
.set.done .field input{border-color:var(--logged)}
.prev-note{font-size:.75rem; color:var(--muted); margin:10px 0 0; font-variant-numeric:tabular-nums}

label.block{display:flex; flex-direction:column; gap:6px; font-size:.9rem}
textarea,input.text{
  width:100%; background:var(--field); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:10px; font-size:16px; font-family:var(--sans); min-height:44px;
}
textarea{min-height:80px; resize:vertical; line-height:1.5}
.notes-stack{display:flex; flex-direction:column; gap:12px}

input:focus,textarea:focus{border-color:var(--accent); outline:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.actions{display:flex; flex-direction:column; gap:10px}
.btn{
  appearance:none; min-height:48px; padding:12px 18px; border-radius:10px;
  font-size:1rem; font-weight:650; font-family:var(--sans); cursor:pointer;
  border:1px solid transparent; transition:opacity .12s;
}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-quiet{background:transparent; color:var(--muted); border-color:var(--line)}
.status{font-size:.78rem; color:var(--muted); text-align:center; min-height:1.2em}
.status.good{color:var(--logged)}

.problem{border-color:var(--warn)}
.problem h2{color:var(--warn)}
.problem code{
  font-family:var(--mono); font-size:.82rem; background:var(--field);
  padding:2px 6px; border-radius:4px; word-break:break-word;
}
.problem ul{margin:8px 0 0; padding-left:20px; font-size:.88rem; line-height:1.6}
.stale{font-size:.78rem; color:var(--warn)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="status" id="boot">Loading this week's program…</p>
</div>

<script>
"use strict";

const PROGRAM_URL = "program.json";
const CACHE_KEY   = "trainingLog:program:v1";
const STATE_KEY   = "trainingLog:state:v1";
const HISTORY_KEY = "trainingLog:history:v1";

const READINESS = [
  { key:"sleep",  label:"Sleep" },
  { key:"energy", label:"Energy" },
  { key:"back",   label:"Back confidence" }
];

const app = document.getElementById("app");
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
};
const readJSON = key => {
  try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; }
};

/* ---------- Validation ----------
   An AI writes program.json, so assume it will occasionally be wrong and say
   exactly what's wrong rather than rendering a broken page. */
function validate(p){
  const errs = [];
  if(typeof p !== "object" || p === null || Array.isArray(p)) {
    return ["The file must contain a single JSON object."];
  }
  if(!Array.isArray(p.sessions) || p.sessions.length === 0){
    errs.push("`sessions` must be an array with at least one session.");
    return errs;
  }
  p.sessions.forEach((s, i) => {
    const at = `sessions[${i}]`;
    if(!s || typeof s !== "object"){ errs.push(`${at} must be an object.`); return; }
    if(!s.day && !s.title) errs.push(`${at} needs a \`day\` or a \`title\`.`);
    if(!Array.isArray(s.exercises) || s.exercises.length === 0){
      errs.push(`${at}.exercises must be an array with at least one exercise.`);
      return;
    }
    s.exercises.forEach((e, j) => {
      const eat = `${at}.exercises[${j}]`;
      if(!e || typeof e !== "object"){ errs.push(`${eat} must be an object.`); return; }
      if(typeof e.name !== "string" || !e.name.trim()) errs.push(`${eat}.name must be a non-empty string.`);
      if(!Number.isInteger(e.sets) || e.sets < 1 || e.sets > 20)
        errs.push(`${eat}.sets must be a whole number from 1 to 20 (got ${JSON.stringify(e.sets)}).`);
    });
    const names = s.exercises.map(e => e && e.name).filter(Boolean);
    const dupes = names.filter((n, k) => names.indexOf(n) !== k);
    if(dupes.length) errs.push(`${at} has repeated exercise names (${[...new Set(dupes)].join(", ")}). Names identify saved sets, so make them unique.`);
  });
  return errs;
}

function showProblem(title, lines, extra){
  app.innerHTML = "";
  const card = el("section", "card problem");
  card.appendChild(el("h2", null, title));
  if(extra) card.appendChild(el("p", "session-note", extra));
  const ul = el("ul");
  lines.forEach(l => {
    const li = el("li");
    li.innerHTML = l.replace(/`([^`]+)`/g, "<code>$1</code>");
    ul.appendChild(li);
  });
  card.appendChild(ul);
  app.appendChild(card);
}

/* ---------- Load ---------- */
async function load(){
  let text = null, netErr = null;

  try{
    const res = await fetch(PROGRAM_URL, { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    text = await res.text();
  }catch(err){
    netErr = err;
  }

  // Reached the file: it is the source of truth, so report its problems rather
  // than silently falling back to a stale copy.
  if(text !== null){
    let program;
    try{
      program = JSON.parse(text);
    }catch(err){
      showProblem("program.json isn't valid JSON", [
        `The file was downloaded but couldn't be parsed: ${err.message}`,
        "Usually a trailing comma, a missing bracket, or smart quotes instead of straight ones."
      ], "Nothing else on this page will work until the file parses.");
      return;
    }
    const errs = validate(program);
    if(errs.length){
      showProblem("There's a problem with program.json", errs,
        "The page won't guess at what you meant. Fix the file in GitHub and reload.");
      return;
    }
    // Only cache what passed, so a bad publish can't poison the offline copy.
    localStorage.setItem(CACHE_KEY, JSON.stringify(program));
    render(program, false);
    return;
  }

  // Couldn't reach the file — fall back to the last good copy.
  const cached = readJSON(CACHE_KEY);
  if(cached && validate(cached).length === 0){
    render(cached, true);
    return;
  }
  showProblem("Can't load the program", [
    "The page couldn't fetch `program.json`, and there's no good saved copy on this device yet.",
    "If you're offline, open it once with a connection and it'll be kept for next time.",
    `Details: ${netErr ? netErr.message : "unknown error"}`
  ]);
}

/* ---------- Render ---------- */
function render(program, stale){
  const block = program.block || "Training";
  const week  = program.week != null ? `Week ${program.week}` : "";

  let state   = readJSON(STATE_KEY) || {};
  const history = readJSON(HISTORY_KEY) || {};

  // Pick today's session by weekday name if it matches, else the first.
  const today = new Date().toLocaleDateString("en-AU", { weekday:"long" });
  let active = program.sessions.findIndex(s => (s.day || "").toLowerCase() === today.toLowerCase());
  if(active < 0) active = 0;

  const sessionKey = i => {
    const s = program.sessions[i];
    return `${block}|${program.week}|${s.day || s.title || i}`;
  };
  const stateFor = i => {
    const k = sessionKey(i);
    if(!state[k]) state[k] = { readiness:{}, exercises:{}, session:{ strongest:"", weakest:"", notes:"" } };
    return state[k];
  };

  let statusTimer = null;
  function save(statusNode){
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    if(!statusNode) return;
    clearTimeout(statusTimer);
    statusNode.textContent = "Saved";
    statusNode.classList.add("good");
    statusTimer = setTimeout(() => {
      statusNode.textContent = "Saves as you go";
      statusNode.classList.remove("good");
    }, 1200);
  }

  function draw(){
    const session = program.sessions[active];
    const st = stateFor(active);
    const exState = name => {
      if(!st.exercises[name]) st.exercises[name] = { sets:{}, notes:"" };
      if(!st.exercises[name].sets) st.exercises[name].sets = {};
      return st.exercises[name];
    };
    const last = history[sessionKey(active)] || null;
    const prevSet = (name, n) => {
      const e = last && last.exercises && last.exercises[name];
      const s = e && e.sets && e.sets[n];
      return (s && (s.weight || s.reps)) ? s : null;
    };

    app.innerHTML = "";

    // Header
    const head = el("header");
    head.appendChild(el("span", "eyebrow", [block, week].filter(Boolean).join(" • ")));
    head.appendChild(el("h1", null, session.title || session.day || "Session"));
    const totalSets = session.exercises.reduce((a, e) => a + e.sets, 0);
    const prog = el("p", "progress");
    prog.innerHTML = `<b id="done">0</b> of <b>${totalSets}</b> sets logged`;
    head.appendChild(prog);
    if(stale) head.appendChild(el("span", "stale", "Offline — showing the last program saved on this device."));
    app.appendChild(head);

    // Day picker
    if(program.sessions.length > 1){
      const days = el("div", "days");
      program.sessions.forEach((s, i) => {
        const b = el("button", null, s.day || s.title || `Day ${i + 1}`);
        b.type = "button";
        b.setAttribute("aria-pressed", String(i === active));
        b.addEventListener("click", () => { active = i; draw(); window.scrollTo(0, 0); });
        days.appendChild(b);
      });
      app.appendChild(days);
    }

    if(session.notes){
      const card = el("section", "card");
      card.appendChild(el("h2", null, "Session brief"));
      card.appendChild(el("p", "session-note", session.notes));
      app.appendChild(card);
    }

    // Readiness
    const rdyCard = el("section", "card");
    rdyCard.appendChild(el("h2", null, "Readiness"));
    const rdy = el("div", "rdy");
    READINESS.forEach(item => {
      const row = el("div", "rdy-row");
      row.appendChild(el("span", null, item.label));
      const scale = el("div", "scale");
      scale.setAttribute("role", "group");
      scale.setAttribute("aria-label", item.label);
      for(let n = 1; n <= 5; n++){
        const b = el("button", null, String(n));
        b.type = "button";
        b.setAttribute("aria-pressed", String(st.readiness[item.key] === n));
        b.addEventListener("click", () => {
          st.readiness[item.key] = st.readiness[item.key] === n ? null : n;
          [...scale.children].forEach((c, i) => c.setAttribute("aria-pressed", String(st.readiness[item.key] === i + 1)));
          save(status);
        });
        scale.appendChild(b);
      }
      row.appendChild(scale);
      rdy.appendChild(row);
    });
    rdyCard.appendChild(rdy);
    app.appendChild(rdyCard);

    // Exercises
    const doneEl = () => document.getElementById("done");
    function refreshProgress(){
      let n = 0;
      session.exercises.forEach(e => {
        for(let i = 1; i <= e.sets; i++){
          const s = exState(e.name).sets[i];
          if(s && s.weight && s.reps) n++;
        }
      });
      doneEl().textContent = n;
    }

    session.exercises.forEach(exercise => {
      const card = el("section", "card");
      const h = el("div", "ex-head");
      h.appendChild(el("h3", null, exercise.name));
      if(exercise.target) h.appendChild(el("span", "target", exercise.target));
      card.appendChild(h);
      if(exercise.notes) card.appendChild(el("p", "cue", exercise.notes));

      const ch = el("div", "col-head");
      ch.append(el("span", null, "Set"), el("span", null, "Weight"), el("span", null, "Reps"));
      card.appendChild(ch);

      const sets = el("div", "sets");
      for(let n = 1; n <= exercise.sets; n++){
        const saved = exState(exercise.name).sets[n] || { weight:"", reps:"" };
        const last  = prevSet(exercise.name, n);
        const row   = el("div", "set");
        row.appendChild(el("span", "set-n", String(n)));

        const inputs = {};
        [["weight","kg","decimal"],["reps","×","numeric"]].forEach(([field, unit, mode]) => {
          const wrap = el("div", "field");
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = mode;
          input.value = saved[field] || "";
          input.placeholder = last ? String(last[field] || "") : "";
          input.setAttribute("aria-label", `${exercise.name} set ${n} ${field}`);
          input.addEventListener("input", () => {
            const s = exState(exercise.name).sets;
            s[n] = s[n] || { weight:"", reps:"" };
            s[n][field] = input.value.trim();
            row.classList.toggle("done", Boolean(inputs.weight.value.trim() && inputs.reps.value.trim()));
            refreshProgress();
            save(status);
          });
          inputs[field] = input;
          wrap.append(input, el("span", "unit", unit));
          row.appendChild(wrap);
        });
        row.classList.toggle("done", Boolean(saved.weight && saved.reps));
        sets.appendChild(row);
      }
      card.appendChild(sets);

      const lastLine = [];
      for(let n = 1; n <= exercise.sets; n++){
        const p = prevSet(exercise.name, n);
        if(p) lastLine.push(`${p.weight || "—"}×${p.reps || "—"}`);
      }
      if(lastLine.length) card.appendChild(el("p", "prev-note", "Last time:  " + lastLine.join("   ·   ")));

      const nl = el("label", "block");
      nl.style.marginTop = "14px";
      nl.append("Notes");
      const ta = document.createElement("textarea");
      ta.style.minHeight = "56px";
      ta.value = exState(exercise.name).notes || "";
      ta.addEventListener("input", () => { exState(exercise.name).notes = ta.value; save(status); });
      nl.appendChild(ta);
      card.appendChild(nl);

      app.appendChild(card);
    });

    // Session notes
    const nc = el("section", "card");
    nc.appendChild(el("h2", null, "Session notes"));
    const stack = el("div", "notes-stack");
    [["Strongest exercise","strongest","input"],["Weakest exercise","weakest","input"],["General notes","notes","textarea"]]
      .forEach(([label, key, kind]) => {
        const l = el("label", "block");
        l.append(label);
        const f = document.createElement(kind);
        if(kind === "input"){ f.type = "text"; f.className = "text"; f.autocomplete = "off"; }
        f.value = st.session[key] || "";
        f.addEventListener("input", () => { st.session[key] = f.value; save(status); });
        l.appendChild(f);
        stack.appendChild(l);
      });
    nc.appendChild(stack);
    app.appendChild(nc);

    // Actions
    const actions = el("div", "actions");
    const finish = el("button", "btn btn-primary", "Finish session");
    finish.type = "button";
    const backup = el("button", "btn btn-quiet", "Download a copy");
    backup.type = "button";
    const status = el("p", "status", "Saves as you go");
    actions.append(finish, backup, status);
    app.appendChild(actions);

    function build(){
      return {
        block, week: program.week,
        day: session.day || null,
        title: session.title || null,
        completedAt: new Date().toISOString(),
        readiness: st.readiness,
        exercises: session.exercises.reduce((acc, e) => {
          acc[e.name] = {
            target: e.target || null,
            sets: Object.fromEntries(
              Array.from({ length:e.sets }, (_, i) =>
                [i + 1, exState(e.name).sets[i + 1] || { weight:"", reps:"" }])
            ),
            notes: exState(e.name).notes || ""
          };
          return acc;
        }, {}),
        session: st.session
      };
    }
    function download(data){
      const stamp = new Date().toISOString().slice(0, 10);
      const slug  = (session.day || session.title || "session").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const blob  = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement("a");
      a.href = url;
      a.download = `${stamp}-w${program.week}-${slug}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    backup.addEventListener("click", () => download(build()));
    finish.addEventListener("click", () => {
      if(!confirm("Finish this session?\n\nIt saves a file to your device, becomes the “last time” you'll see next week, and clears the form.")) return;
      const data = build();
      download(data);
      history[sessionKey(active)] = data;
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      delete state[sessionKey(active)];
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
      draw();
      window.scrollTo(0, 0);
    });

    refreshProgress();
  }

  draw();
}

load();

// isSecureContext covers https and localhost, so this is testable locally too.
if("serviceWorker" in navigator && window.isSecureContext){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
