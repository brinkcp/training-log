<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181A">
<meta name="mobile-web-app-capable" content="yes">
<title>Training Log</title>
<style>
:root{
  --ground:#16181A; --card:#212427; --field:#2A2E32; --line:#3A4046; --line-soft:#2E3337;
  --text:#EDEFF1; --muted:#939BA2; --accent:#E3A54A; --accent-ink:#16181A;
  --logged:#6FBF8B; --warn:#E0705C;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:660px; margin:0 auto; padding:20px 16px 56px; display:flex; flex-direction:column; gap:14px}

header{display:flex; flex-direction:column; gap:5px}
.eyebrow{font-size:.72rem; text-transform:uppercase; letter-spacing:.11em; color:var(--accent); font-weight:600}
h1{font-size:1.45rem; font-weight:650; margin:0; letter-spacing:-.02em; text-wrap:balance; line-height:1.2}
.meta{font-size:.82rem; color:var(--muted)}
.goal{font-size:.9rem; color:var(--muted); line-height:1.5; margin:6px 0 0}
.progress{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
.progress b{color:var(--text); font-weight:600}

.card{background:var(--card); border:1px solid var(--line-soft); border-radius:12px; padding:16px}
h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0; font-weight:600}
.h2row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px}
.h2row .dur{font-size:.72rem; color:var(--muted); font-family:var(--mono); white-space:nowrap}
.blocknote{font-size:.85rem; color:var(--accent); line-height:1.5; margin:0 0 12px}

/* reference blocks — read, don't fill in */
.ref{display:flex; flex-direction:column; gap:12px}
.ref-item{display:flex; flex-direction:column; gap:2px; padding-left:12px; border-left:2px solid var(--line)}
.ref-item .nm{font-size:.95rem; font-weight:600}
.ref-item .dt{font-size:.85rem; color:var(--accent); font-family:var(--mono)}
.ref-item .fc{font-size:.82rem; color:var(--muted); line-height:1.45}

/* scales */
.scale-row{display:flex; flex-direction:column; gap:6px}
.scale-row > span{font-size:.9rem}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.scale button{
  appearance:none; background:var(--field); color:var(--text); border:1px solid var(--line);
  border-radius:8px; min-height:42px; font-size:.95rem; font-family:var(--mono); cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
}
.scale button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.stack{display:flex; flex-direction:column; gap:14px}

/* logged exercises */
.ex{padding-top:14px; border-top:1px solid var(--line-soft)}
.ex:first-child{padding-top:0; border-top:0}
.ex-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.ex-head h3{margin:0; font-size:1.05rem; font-weight:600; letter-spacing:-.01em}
.pair{font-family:var(--mono); font-size:.75rem; color:var(--accent); margin-right:6px}
.target{font-size:.82rem; color:var(--accent); font-family:var(--mono); white-space:nowrap}
.presc{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0}
.chip{
  font-size:.72rem; font-family:var(--mono); color:var(--muted);
  border:1px solid var(--line); border-radius:999px; padding:3px 9px;
}
.cue{font-size:.82rem; color:var(--muted); margin:8px 0 0; line-height:1.45}
.coachnote{font-size:.82rem; color:var(--accent); margin:6px 0 0; line-height:1.45}

.col-head{display:grid; grid-template-columns:22px 1fr 1fr; gap:8px; margin:12px 0 6px}
.col-head span{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.col-head span:first-child{text-align:center}
.sets{display:flex; flex-direction:column; gap:7px}
.set{display:grid; grid-template-columns:22px 1fr 1fr; gap:8px; align-items:center}
.set-n{font-family:var(--mono); font-size:.8rem; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
.set.done .set-n{color:var(--logged); font-weight:700}
.field{position:relative; display:flex; align-items:center}
.field input{
  width:100%; min-height:44px; padding:8px 26px 8px 8px;
  background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:8px;
  font-size:16px; font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.field .unit{position:absolute; right:7px; font-size:.68rem; color:var(--muted); pointer-events:none}
.set.done .field input{border-color:var(--logged)}
.prev-note{font-size:.75rem; color:var(--muted); margin:9px 0 0; font-variant-numeric:tabular-nums}
.conf{margin-top:12px}
.conf > span{font-size:.8rem; color:var(--muted); display:block; margin-bottom:6px}
.rpe-row{margin-top:12px; display:flex; align-items:center; gap:10px}
.rpe-row > span{font-size:.8rem; color:var(--muted)}
.rpe-row input{
  width:88px; min-height:44px; padding:8px 10px; background:var(--field); color:var(--text);
  border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:var(--mono);
  font-variant-numeric:tabular-nums; text-align:center;
}
.cond-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px}
.cond-grid label{display:flex; flex-direction:column; gap:5px; font-size:.78rem; color:var(--muted)}
.cond-grid input{
  min-height:44px; padding:8px 10px; background:var(--field); color:var(--text);
  border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:var(--mono);
  font-variant-numeric:tabular-nums;
}
.prescribed{font-size:.75rem; color:var(--muted); margin:10px 0 0}
.date-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:8px}
.date-row label{display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--muted)}
.date-row input{
  background:var(--field); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:8px 10px; min-height:40px; font-size:16px;
  font-family:var(--mono); color-scheme:dark;
}
.renote{font-size:.75rem; color:var(--accent)}

label.block{display:flex; flex-direction:column; gap:6px; font-size:.9rem}
textarea,input.text{
  width:100%; background:var(--field); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:10px; font-size:16px; font-family:var(--sans); min-height:44px;
}
textarea{min-height:70px; resize:vertical; line-height:1.5}
input:focus,textarea:focus{border-color:var(--accent); outline:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.later{border-color:var(--accent)}
.later h2{color:var(--accent)}
.later .why{font-size:.82rem; color:var(--muted); margin:0 0 12px; line-height:1.5}

.actions{display:flex; flex-direction:column; gap:10px}
.btn{
  appearance:none; min-height:48px; padding:12px 18px; border-radius:10px;
  font-size:1rem; font-weight:650; font-family:var(--sans); cursor:pointer;
  border:1px solid transparent; transition:opacity .12s;
}
.btn:active{opacity:.75}
.btn:disabled{opacity:.5; cursor:default}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-quiet{background:transparent; color:var(--muted); border-color:var(--line)}
.status{font-size:.78rem; color:var(--muted); text-align:center; min-height:1.2em}
.status.good{color:var(--logged)}

.sync{padding:14px 16px}
.sync summary{
  font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
  font-weight:600; cursor:pointer; list-style:none; min-height:24px; display:flex; align-items:center; gap:8px;
}
.sync summary::-webkit-details-marker{display:none}
.sync summary::before{content:"▸"; color:var(--accent); font-size:.9rem}
.sync[open] summary::before{content:"▾"}
.sync .actions{margin-top:4px}

.problem{border-color:var(--warn)}
.problem h2{color:var(--warn)}
.problem code{font-family:var(--mono); font-size:.82rem; background:var(--field); padding:2px 6px; border-radius:4px; word-break:break-word}
.problem ul{margin:8px 0 0; padding-left:20px; font-size:.88rem; line-height:1.6}
.stale{font-size:.78rem; color:var(--warn)}

.days{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px}
.days button{
  appearance:none; flex:0 0 auto; background:var(--field); color:var(--text);
  border:1px solid var(--line); border-radius:999px; padding:9px 16px;
  min-height:44px; font-size:.9rem; font-family:var(--sans); cursor:pointer;
}
.days button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:650}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="status">Loading this week's program…</p>
</div>

<script>
"use strict";

const PROGRAM_URL = "program.json";
const CACHE_KEY   = "trainingLog:program:v2";
const STATE_KEY   = "trainingLog:state:v2";
const HISTORY_KEY = "trainingLog:history:v2";
const SYNC_KEY    = "trainingLog:sync:v1";
const QUEUE_KEY   = "trainingLog:queue:v1";

/* Constant across every session so far, so they're built in rather than
   restated in each program file. */
const READINESS = [
  { key:"sleep",  label:"Sleep" },
  { key:"energy", label:"Energy" },
  { key:"back",   label:"Back confidence" }
];

const BACK_CHECK = [
  { key:"before",    label:"Before training" },
  { key:"warmup",    label:"After warm-up" },
  { key:"lifting",   label:"During lifting" },
  { key:"after",     label:"Immediately after" },
  { key:"laterHours",label:"2–3 hours later", late:true }
];

// Post-session readings that aren't about the back. Asked for in two of the
// first three sessions, so built in rather than restated per program.
const POST_SESSION = [
  { key:"energy", label:"Energy immediately after" }
];

const REFLECTION = [
  { key:"awkward",   label:"Anything awkward or technically difficult", kind:"textarea" }
];

const app = document.getElementById("app");
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
};
const readJSON = key => {
  try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; }
};

// Local date parts, not toISOString(). Perth is UTC+8, so a 6am session would
// otherwise be filed under the previous calendar day.
function localDate(d = new Date()){
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ---------- GitHub sync ---------- */
const sync = {
  get config(){ return readJSON(SYNC_KEY); },
  set config(v){ v ? localStorage.setItem(SYNC_KEY, JSON.stringify(v)) : localStorage.removeItem(SYNC_KEY); },
  get queue(){ return readJSON(QUEUE_KEY) || []; },
  set queue(v){ localStorage.setItem(QUEUE_KEY, JSON.stringify(v)); }
};

function toBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

async function ghRequest(cfg, path, options){
  return fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    ...options,
    headers: {
      "Authorization": `Bearer ${cfg.token}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(options && options.headers)
    }
  });
}

function ghError(status){
  if(status === 401) return { kind:"auth", message:
    "Token rejected (401) — expired, or mistyped. Create a new token and paste it into the settings below." };
  if(status === 403) return { kind:"auth", message:
    "Forbidden (403). The token needs Permissions → Repository permissions → Contents: Read and write." };
  if(status === 404) return { kind:"auth", message:
    "Not found (404). Either the owner/repo is wrong, or the token doesn't cover this repo — a fine-grained token only reaches repositories picked when it was created, so one made later has to be added to it." };
  if(status === 409) return { kind:"other", message:
    "Conflict (409). The repo may have no commits yet — add a README to it and try again." };
  if(status === 422) return { kind:"other", message:
    "Rejected (422). GitHub wouldn't accept the file — the path or branch may be invalid." };
  return { kind:"other", message:`GitHub returned ${status}.` };
}

const netFail = err => ({ ok:false, kind:"network", error:`No connection to GitHub (${err.message}).` });

async function pushSession(cfg, entry){
  let sha = null;
  try{
    const head = await ghRequest(cfg, entry.path, { method:"GET" });
    if(head.ok) sha = (await head.json()).sha;
    else if(head.status !== 404){
      const e = ghError(head.status);
      return { ok:false, kind:e.kind, error:e.message };
    }
  }catch(err){ return netFail(err); }

  try{
    const res = await ghRequest(cfg, entry.path, {
      method: "PUT",
      body: JSON.stringify({
        message: entry.message,
        content: toBase64(entry.json),
        ...(sha ? { sha } : {})
      })
    });
    if(!res.ok){
      const e = ghError(res.status);
      return { ok:false, kind:e.kind, error:e.message };
    }
    return { ok:true };
  }catch(err){ return netFail(err); }
}

// Only ever called after the replacement file is confirmed written, so a failed
// delete leaves a stray copy rather than losing the session.
async function deleteFile(cfg, path){
  try{
    const head = await ghRequest(cfg, path, { method:"GET" });
    if(head.status === 404) return { ok:true };          // already gone
    if(!head.ok) return { ok:false, error:ghError(head.status).message };
    const sha = (await head.json()).sha;
    const res = await ghRequest(cfg, path, {
      method: "DELETE",
      body: JSON.stringify({ message:`Renaming session file`, sha })
    });
    return res.ok ? { ok:true } : { ok:false, error:ghError(res.status).message };
  }catch(err){
    return { ok:false, error:`No connection to GitHub (${err.message}).` };
  }
}

// Latest write for a given path wins — re-saving a session replaces the queued
// copy rather than stacking duplicates behind it.
function enqueue(entry){
  sync.queue = sync.queue.filter(q => q.path !== entry.path).concat([entry]);
}

async function flushQueue(){
  const cfg = sync.config;
  const queue = sync.queue;
  if(!cfg || !cfg.token || queue.length === 0) return { pushed:0, failed:queue.length };

  let pushed = 0, error = null, kind = null;
  const remaining = [];
  for(const entry of queue){
    if(error){ remaining.push(entry); continue; }
    const res = await pushSession(cfg, entry);
    if(res.ok) pushed++;
    else { error = res.error; kind = res.kind; remaining.push(entry); }
  }
  sync.queue = remaining;
  return { pushed, failed:remaining.length, error, kind };
}

let redraw = () => {};

/* ---------- Settings ---------- */
function syncCard(){
  const cfg = sync.config || { owner:"", repo:"", token:"" };
  const wrap = document.createElement("details");
  wrap.className = "card sync";

  const sum = document.createElement("summary");
  sum.textContent = cfg.token ? `Saving to ${cfg.owner}/${cfg.repo}` : "Set up saving to GitHub";
  wrap.appendChild(sum);

  const body = el("div", "stack");
  body.style.marginTop = "14px";

  const mk = (labelText, value, type, placeholder) => {
    const l = el("label", "block");
    l.append(labelText);
    const i = document.createElement("input");
    i.className = "text"; i.type = type; i.value = value || "";
    i.placeholder = placeholder || ""; i.autocomplete = "off";
    i.autocapitalize = "none"; i.spellcheck = false;
    l.appendChild(i); body.appendChild(l);
    return i;
  };

  const owner = mk("GitHub username", cfg.owner, "text", "brinkcp");
  const repo  = mk("Private repo for sessions", cfg.repo, "text", "training-data");
  const token = mk("Fine-grained token", cfg.token, "password", "github_pat_…");

  body.appendChild(el("p", "cue",
    "The token stays in this browser on this device. It is never sent anywhere except GitHub, and never written into the public repo. Revoke it any time from GitHub settings."));

  const row = el("div", "actions");
  const saveBtn  = el("button", "btn btn-primary", "Save and test"); saveBtn.type = "button";
  const clearBtn = el("button", "btn btn-quiet", "Forget token");    clearBtn.type = "button";
  const out = el("p", "status", "");
  row.append(saveBtn, clearBtn, out);
  body.appendChild(row);

  saveBtn.addEventListener("click", async () => {
    const next = { owner:owner.value.trim(), repo:repo.value.trim(), token:token.value.trim() };
    if(!next.owner || !next.repo || !next.token){ out.textContent = "Fill in all three fields."; return; }
    saveBtn.disabled = true;
    out.textContent = "Testing…";
    const probe = await pushSession(next, {
      path: "sessions/.connection-test.json",
      message: "Connection test from training log",
      json: JSON.stringify({ testedAt:new Date().toISOString() }, null, 2)
    });
    saveBtn.disabled = false;
    if(probe.ok){
      sync.config = next;
      sum.textContent = `Saving to ${next.owner}/${next.repo}`;
      out.classList.add("good");
      const pending = sync.queue.length;
      if(pending){
        out.textContent = `Connected. Uploading ${pending} pending…`;
        const res = await flushQueue();
        out.textContent = res.failed
          ? `Connected, but ${res.failed} still pending. ${res.error || ""}`
          : `Connected. ${pending} pending session${pending > 1 ? "s" : ""} uploaded.`;
        redraw();
      }else{
        out.textContent = "Connected. Saving a session now writes here.";
      }
    }else{
      out.textContent = probe.error;
      out.classList.remove("good");
    }
  });

  clearBtn.addEventListener("click", () => {
    if(!confirm("Forget the token on this device?\n\nSaving a session will download a file instead. Any pending uploads stay queued.")) return;
    sync.config = null; token.value = "";
    out.textContent = "Token removed from this device.";
    out.classList.remove("good");
    sum.textContent = "Set up saving to GitHub";
  });

  wrap.appendChild(body);
  return wrap;
}

/* ---------- Validation ----------
   An AI writes program.json, so malformed input is expected, not exceptional. */
function validate(p){
  const errs = [];
  if(typeof p !== "object" || p === null || Array.isArray(p)) return ["The file must contain a single JSON object."];
  if(!Array.isArray(p.sessions) || p.sessions.length === 0){
    errs.push("`sessions` must be an array with at least one session.");
    return errs;
  }
  p.sessions.forEach((s, i) => {
    const at = `sessions[${i}]`;
    if(!s || typeof s !== "object"){ errs.push(`${at} must be an object.`); return; }
    if(!s.day && !s.title) errs.push(`${at} needs a \`day\` or a \`title\`.`);
    if(!Array.isArray(s.blocks) || s.blocks.length === 0){
      errs.push(`${at}.blocks must be an array with at least one block.`);
      return;
    }
    const logged = [];
    s.blocks.forEach((b, j) => {
      const bat = `${at}.blocks[${j}]`;
      if(!b || typeof b !== "object"){ errs.push(`${bat} must be an object.`); return; }
      if(!["log", "reference", "conditioning"].includes(b.type)){
        errs.push(`${bat}.type must be "log", "reference" or "conditioning" (got ${JSON.stringify(b.type)}).`);
        return;
      }
      if(!b.title) errs.push(`${bat} needs a \`title\`.`);
      if(b.type === "reference" || b.type === "conditioning"){
        if(!Array.isArray(b.items) || b.items.length === 0)
          errs.push(`${bat}.items must be an array with at least one item (${b.type} blocks).`);
        else b.items.forEach((it, k) => {
          if(!it || typeof it.name !== "string" || !it.name.trim())
            errs.push(`${bat}.items[${k}].name must be a non-empty string.`);
        });
      }else{
        if(!Array.isArray(b.exercises) || b.exercises.length === 0){
          errs.push(`${bat}.exercises must be an array with at least one exercise (log blocks).`);
          return;
        }
        b.exercises.forEach((e, k) => {
          const eat = `${bat}.exercises[${k}]`;
          if(!e || typeof e !== "object"){ errs.push(`${eat} must be an object.`); return; }
          if(typeof e.name !== "string" || !e.name.trim()) errs.push(`${eat}.name must be a non-empty string.`);
          else logged.push(e.name);
          if(!Number.isInteger(e.sets) || e.sets < 1 || e.sets > 20)
            errs.push(`${eat}.sets must be a whole number from 1 to 20 (got ${JSON.stringify(e.sets)}).`);
        });
      }
    });
    const dupes = logged.filter((n, k) => logged.indexOf(n) !== k);
    if(dupes.length) errs.push(`${at} logs the same exercise name more than once (${[...new Set(dupes)].join(", ")}). Names identify saved sets, so make them unique.`);
  });
  return errs;
}

function showProblem(title, lines, extra){
  app.innerHTML = "";
  const card = el("section", "card problem");
  card.appendChild(el("h2", null, title));
  if(extra) card.appendChild(el("p", "cue", extra));
  const ul = el("ul");
  lines.forEach(l => {
    const li = el("li");
    // Messages quote values from program.json; escape before any markup goes in.
    const safe = l.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
    li.innerHTML = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
    ul.appendChild(li);
  });
  card.appendChild(ul);
  app.appendChild(card);
}

/* ---------- Load ---------- */
async function load(){
  let text = null, netErr = null;
  try{
    const res = await fetch(PROGRAM_URL, { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    text = await res.text();
  }catch(err){ netErr = err; }

  if(text !== null){
    let program;
    try{ program = JSON.parse(text); }
    catch(err){
      showProblem("program.json isn't valid JSON", [
        `The file was downloaded but couldn't be parsed: ${err.message}`,
        "Usually a trailing comma, a missing bracket, or smart quotes instead of straight ones."
      ], "Nothing else on this page will work until the file parses.");
      return;
    }
    const errs = validate(program);
    if(errs.length){
      showProblem("There's a problem with program.json", errs,
        "The page won't guess at what you meant. Fix the file in GitHub and reload.");
      return;
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(program));
    render(program, false);
    return;
  }

  const cached = readJSON(CACHE_KEY);
  if(cached && validate(cached).length === 0){ render(cached, true); return; }
  showProblem("Can't load the program", [
    "The page couldn't fetch `program.json`, and there's no good saved copy on this device yet.",
    "If you're offline, open it once with a connection and it'll be kept for next time.",
    `Details: ${netErr ? netErr.message : "unknown error"}`
  ]);
}

/* ---------- Render ---------- */
function render(program, stale){
  const blockName = program.block || "Training";
  const weekLabel = program.week != null ? `Week ${program.week}` : "";
  let state = readJSON(STATE_KEY) || {};
  const history = readJSON(HISTORY_KEY) || {};

  const today = new Date().toLocaleDateString("en-AU", { weekday:"long" });
  let active = program.sessions.findIndex(s => (s.day || "").toLowerCase() === today.toLowerCase());
  if(active < 0) active = 0;

  const keyFor = i => {
    const s = program.sessions[i];
    return `${blockName}|${program.week}|${s.day || s.title || i}`;
  };
  const stateFor = i => {
    const k = keyFor(i);
    if(!state[k]) state[k] = { readiness:{}, exercises:{}, backCheck:{}, reflection:{}, answers:{} };
    const st = state[k];
    st.readiness = st.readiness || {}; st.exercises = st.exercises || {};
    st.backCheck = st.backCheck || {}; st.reflection = st.reflection || {}; st.answers = st.answers || {};
    st.postSession = st.postSession || {};
    st.date = st.date || localDate();   // the day actually trained, editable
    return st;
  };

  let statusEl = null, statusTimer = null;
  function save(){
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    if(!statusEl) return;
    clearTimeout(statusTimer);
    statusEl.textContent = "Saved on this device";
    statusEl.classList.add("good");
    statusTimer = setTimeout(() => {
      statusEl.textContent = defaultStatus();
      statusEl.classList.remove("good");
    }, 1200);
  }
  function defaultStatus(){
    const st = stateFor(active);
    return st.savedAt ? `Last saved to GitHub ${new Date(st.savedAt).toLocaleString("en-AU")}` : "Saves as you go";
  }

  // Scales use 1–5 touch buttons (single row on phone).
  function scale(labelText, max, getVal, setVal){
    const row = el("div", "scale-row");
    row.appendChild(el("span", null, labelText));
    const grid = el("div", "scale");
    grid.setAttribute("role", "group");
    grid.setAttribute("aria-label", labelText);
    for(let n = 1; n <= max; n++){
      const b = el("button", null, String(n));
      b.type = "button";
      b.setAttribute("aria-pressed", String(getVal() === n));
      b.addEventListener("click", () => {
        setVal(getVal() === n ? null : n);
        [...grid.children].forEach((c, i) => c.setAttribute("aria-pressed", String(getVal() === i + 1)));
        save();
      });
      grid.appendChild(b);
    }
    row.appendChild(grid);
    return row;
  }

  function textField(labelText, kind, getVal, setVal){
    const l = el("label", "block");
    l.append(labelText);
    const f = document.createElement(kind);
    if(kind === "input"){ f.type = "text"; f.className = "text"; f.autocomplete = "off"; }
    f.value = getVal() || "";
    f.addEventListener("input", () => { setVal(f.value); save(); });
    l.appendChild(f);
    return l;
  }

  function draw(){
    const session = program.sessions[active];
    const st = stateFor(active);
    const exState = name => {
      if(!st.exercises[name]) st.exercises[name] = { sets:{}, rpe:"", notes:"" };
      const e = st.exercises[name];
      e.sets = e.sets || {};
      return e;
    };
    // RPE used to live on each set. Lift the first set's value up so sessions
    // logged under the old shape keep it instead of silently losing it.
    const exRpe = name => {
      const e = exState(name);
      if(!e.rpe && e.sets[1] && e.sets[1].rpe) e.rpe = e.sets[1].rpe;
      return e.rpe || "";
    };
    const condState = name => {
      st.conditioning = st.conditioning || {};
      if(!st.conditioning[name]) st.conditioning[name] = { rounds:"", work:"", rest:"", effort:"", notes:"" };
      return st.conditioning[name];
    };
    const last = history[keyFor(active)] || null;
    const prevSet = (name, n) => {
      const e = last && last.exercises && last.exercises[name];
      const s = e && e.sets && e.sets[n];
      return (s && (s.weight || s.reps)) ? s : null;
    };

    // Defined before the header, which reads pathFor() to warn about a rename.
    // Driven by the editable date, so a session logged a day late is filed under
    // the day it was actually trained.
    function filename(){
      const slug = (session.day || session.title || "session").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      return `${st.date}-w${program.week}-${slug}.json`;
    }
    const pathFor = () => `sessions/${filename()}`;

    app.innerHTML = "";

    /* Header */
    const head = el("header");
    head.appendChild(el("span", "eyebrow",
      [blockName, weekLabel, session.dayLabel].filter(Boolean).join(" • ")));
    head.appendChild(el("h1", null, session.title || session.day || "Session"));
    const metaBits = [session.day, session.duration, session.intensity].filter(Boolean);
    if(metaBits.length) head.appendChild(el("p", "meta", metaBits.join("  ·  ")));
    if(session.goal) head.appendChild(el("p", "goal", session.goal));
    if(session.success) head.appendChild(el("p", "goal", `Success today: ${session.success}`));

    const totalSets = session.blocks
      .filter(b => b.type === "log")
      .reduce((a, b) => a + b.exercises.reduce((x, e) => x + e.sets, 0), 0);
    const prog = el("p", "progress");
    prog.innerHTML = `<b id="done">0</b> of <b>${totalSets}</b> working sets logged`;
    head.appendChild(prog);
    if(stale) head.appendChild(el("span", "stale", "Offline — showing the last program saved on this device."));

    // Defaults to today, but editable — a session logged the next morning should
    // still be filed under the day it happened.
    const dateRow = el("div", "date-row");
    const dateLabel = el("label", null, "Trained on");
    const dateIn = document.createElement("input");
    dateIn.type = "date";
    dateIn.value = st.date;
    dateIn.setAttribute("aria-label", "Date trained");
    dateIn.addEventListener("change", () => {
      st.date = dateIn.value || localDate();
      save();
      draw();
    });
    dateLabel.appendChild(dateIn);
    dateRow.appendChild(dateLabel);
    if(st.savedPath && st.savedPath !== pathFor())
      dateRow.appendChild(el("span", "renote", "Saving will rename the stored file."));
    head.appendChild(dateRow);

    app.appendChild(head);

    if(program.sessions.length > 1){
      const days = el("div", "days");
      program.sessions.forEach((s, i) => {
        const b = el("button", null, s.dayLabel || s.day || s.title || `Day ${i + 1}`);
        b.type = "button";
        b.setAttribute("aria-pressed", String(i === active));
        b.addEventListener("click", () => { active = i; draw(); window.scrollTo(0, 0); });
        days.appendChild(b);
      });
      app.appendChild(days);
    }

    /* Readiness */
    const rc = el("section", "card");
    const rh = el("div", "h2row");
    rh.append(el("h2", null, "Readiness"), el("span", "dur", "out of 5"));
    rc.appendChild(rh);
    const rstack = el("div", "stack");
    READINESS.forEach(item => rstack.appendChild(
      scale(item.label, 5, () => st.readiness[item.key], v => { st.readiness[item.key] = v; })
    ));
    rc.appendChild(rstack);
    app.appendChild(rc);

    /* Blocks */
    function refreshProgress(){
      let n = 0;
      session.blocks.filter(b => b.type === "log").forEach(b => b.exercises.forEach(e => {
        for(let i = 1; i <= e.sets; i++){
          const s = exState(e.name).sets[i];
          if(s && s.weight && s.reps) n++;
        }
      }));
      const d = document.getElementById("done");
      if(d) d.textContent = n;
    }

    session.blocks.forEach(block => {
      const card = el("section", "card");
      const hr = el("div", "h2row");
      hr.appendChild(el("h2", null, block.title));
      if(block.duration) hr.appendChild(el("span", "dur", block.duration));
      card.appendChild(hr);
      if(block.note) card.appendChild(el("p", "blocknote", block.note));

      if(block.type === "reference"){
        const list = el("div", "ref");
        block.items.forEach(it => {
          const row = el("div", "ref-item");
          row.appendChild(el("span", "nm", it.name));
          if(it.detail) row.appendChild(el("span", "dt", it.detail));
          if(it.focus)  row.appendChild(el("span", "fc", it.focus));
          list.appendChild(row);
        });
        card.appendChild(list);
        app.appendChild(card);
        return;
      }

      // Conditioning is prescribed precisely and rarely executed exactly as
      // written, so what actually happened is the interesting part.
      if(block.type === "conditioning"){
        block.items.forEach(item => {
          const c = el("div", "ex");
          const h = el("div", "ex-head");
          h.appendChild(el("h3", null, item.name));
          if(item.detail) h.appendChild(el("span", "target", item.detail));
          c.appendChild(h);
          if(item.focus) c.appendChild(el("p", "cue", item.focus));

          const st_ = condState(item.name);
          const grid = el("div", "cond-grid");
          [["rounds","Rounds done","numeric"],["work","Work (sec)","numeric"],
           ["rest","Rest (sec)","numeric"],["effort","Effort /10","decimal"]]
            .forEach(([k, label, mode]) => {
              const l = el("label", null);
              l.append(label);
              const i = document.createElement("input");
              i.type = "text"; i.inputMode = mode;
              i.value = st_[k] || "";
              i.setAttribute("aria-label", `${item.name} ${label}`);
              i.addEventListener("input", () => { st_[k] = i.value.trim(); save(); });
              l.appendChild(i);
              grid.appendChild(l);
            });
          c.appendChild(grid);
          if(item.detail) c.appendChild(el("p", "prescribed", `Prescribed: ${item.detail}`));
          c.appendChild(textField("Notes", "textarea", () => st_.notes, v => { st_.notes = v; }));
          card.appendChild(c);
        });
        app.appendChild(card);
        return;
      }

      block.exercises.forEach(exercise => {
        const ex = el("div", "ex");
        const h = el("div", "ex-head");
        const h3 = el("h3");
        if(exercise.pair){
          const p = el("span", "pair", exercise.pair);
          h3.appendChild(p);
        }
        h3.appendChild(document.createTextNode(exercise.name));
        h.appendChild(h3);
        if(exercise.target) h.appendChild(el("span", "target", exercise.target));
        ex.appendChild(h);

        const chips = [exercise.prescription, exercise.rpe, exercise.rest && `Rest ${exercise.rest}`].filter(Boolean);
        if(chips.length){
          const cw = el("div", "presc");
          chips.forEach(c => cw.appendChild(el("span", "chip", c)));
          ex.appendChild(cw);
        }
        if(exercise.focus) ex.appendChild(el("p", "cue", exercise.focus));
        if(exercise.note)  ex.appendChild(el("p", "coachnote", exercise.note));

        const ch = el("div", "col-head");
        ch.append(el("span", null, "Set"), el("span", null, "Weight"), el("span", null, "Reps"));
        ex.appendChild(ch);

        const sets = el("div", "sets");
        for(let n = 1; n <= exercise.sets; n++){
          const saved = exState(exercise.name).sets[n] || { weight:"", reps:"" };
          const lastSet = prevSet(exercise.name, n);
          const row = el("div", "set");
          row.appendChild(el("span", "set-n", String(n)));
          const inputs = {};
          [["weight","kg","decimal"],["reps","×","numeric"]].forEach(([f, unit, mode]) => {
            const wrap = el("div", "field");
            const input = document.createElement("input");
            input.type = "text"; input.inputMode = mode;
            input.value = saved[f] || "";
            input.placeholder = lastSet ? String(lastSet[f] || "") : "";
            input.setAttribute("aria-label", `${exercise.name} set ${n} ${f}`);
            input.addEventListener("input", () => {
              const s = exState(exercise.name).sets;
              s[n] = s[n] || { weight:"", reps:"" };
              s[n][f] = input.value.trim();
              row.classList.toggle("done", Boolean(inputs.weight.value.trim() && inputs.reps.value.trim()));
              refreshProgress();
              save();
            });
            inputs[f] = input;
            wrap.append(input, el("span", "unit", unit));
            row.appendChild(wrap);
          });
          row.classList.toggle("done", Boolean(saved.weight && saved.reps));
          sets.appendChild(row);
        }
        ex.appendChild(sets);

        const prevBits = [];
        for(let n = 1; n <= exercise.sets; n++){
          const p = prevSet(exercise.name, n);
          if(p) prevBits.push(`${p.weight || "—"}×${p.reps || "—"}`);
        }
        if(prevBits.length){
          const lastRpe = last && last.exercises && last.exercises[exercise.name] && last.exercises[exercise.name].rpe;
          ex.appendChild(el("p", "prev-note",
            "Last time:  " + prevBits.join("   ·   ") + (lastRpe ? `   @ RPE ${lastRpe}` : "")));
        }

        // One RPE for the exercise, not one per set — the coach's report table is
        // per-exercise, and per-set columns went unfilled after the first row.
        const rpeRow = el("div", "rpe-row");
        rpeRow.appendChild(el("span", null, "RPE for this exercise"));
        const rpeIn = document.createElement("input");
        rpeIn.type = "text"; rpeIn.inputMode = "decimal";
        rpeIn.value = exRpe(exercise.name);
        rpeIn.placeholder = "7";
        rpeIn.setAttribute("aria-label", `${exercise.name} RPE`);
        rpeIn.addEventListener("input", () => { exState(exercise.name).rpe = rpeIn.value.trim(); save(); });
        rpeRow.appendChild(rpeIn);
        ex.appendChild(rpeRow);

        ex.appendChild(textField("Notes", "textarea",
          () => exState(exercise.name).notes,
          v => { exState(exercise.name).notes = v; }));

        card.appendChild(ex);
      });

      app.appendChild(card);
    });

    /* Back check */
    const bc = el("section", "card later");
    bc.appendChild(el("h2", null, "Back & recovery check"));
    bc.appendChild(el("p", "why",
      "Every session so far tracks this. The last one is filled in after you've left — the page stays editable, and saving again updates the same file."));
    const bstack = el("div", "stack");
    BACK_CHECK.forEach(pt => bstack.appendChild(
      scale(pt.late ? `${pt.label}  ⟵ fill in later` : pt.label, 5,
        () => st.backCheck[pt.key], v => { st.backCheck[pt.key] = v; })
    ));
    POST_SESSION.forEach(pt => bstack.appendChild(
      scale(pt.label, 5, () => st.postSession[pt.key], v => { st.postSession[pt.key] = v; })
    ));
    bstack.appendChild(textField("Back notes", "textarea",
      () => st.backCheck.note, v => { st.backCheck.note = v; }));
    bc.appendChild(bstack);
    app.appendChild(bc);

    /* Reflection */
    const rf = el("section", "card");
    rf.appendChild(el("h2", null, "Session report"));
    const rfs = el("div", "stack");
    REFLECTION.forEach(q => rfs.appendChild(
      textField(q.label, q.kind, () => st.reflection[q.key], v => { st.reflection[q.key] = v; })
    ));
    (session.questions || []).forEach((q, i) => rfs.appendChild(
      textField(q, "textarea", () => st.answers[`q${i}`], v => { st.answers[`q${i}`] = v; })
    ));
    rf.appendChild(rfs);
    app.appendChild(rf);

    /* Actions */
    const actions = el("div", "actions");
    const configured = Boolean(sync.config && sync.config.token);
    const saveBtn = el("button", "btn btn-primary",
      st.savedAt ? "Update saved session" : (configured ? "Save session to GitHub" : "Download session"));
    saveBtn.type = "button";
    const dl = el("button", "btn btn-quiet", "Download a copy"); dl.type = "button";
    statusEl = el("p", "status", defaultStatus());
    actions.append(saveBtn, dl, statusEl);
    app.appendChild(actions);

    function build(){
      const loggedBlocks = session.blocks.filter(b => b.type === "log");
      const condBlocks   = session.blocks.filter(b => b.type === "conditioning");
      // Stamped once. Re-saving to add the delayed back check must not move the
      // time the session was actually trained.
      st.completedAt = st.completedAt || new Date().toISOString();
      return {
        block: blockName,
        week: program.week,
        day: session.day || null,
        dayLabel: session.dayLabel || null,
        title: session.title || null,
        date: st.date,
        completedAt: st.completedAt,
        updatedAt: new Date().toISOString(),
        readiness: st.readiness,
        exercises: loggedBlocks.reduce((acc, b) => {
          b.exercises.forEach(e => {
            const s = exState(e.name);
            acc[e.name] = {
              block: b.title,
              pair: e.pair || null,
              target: e.target || null,
              prescribed: e.prescription || null,
              sets: Object.fromEntries(
                Array.from({ length:e.sets }, (_, i) => {
                  const set = s.sets[i + 1] || {};
                  return [i + 1, { weight:set.weight || "", reps:set.reps || "" }];
                })
              ),
              rpe: exRpe(e.name),
              notes: s.notes || ""
            };
          });
          return acc;
        }, {}),
        conditioning: condBlocks.reduce((acc, b) => {
          b.items.forEach(item => {
            const c = condState(item.name);
            acc[item.name] = {
              block: b.title,
              prescribed: item.detail || null,
              rounds: c.rounds || "",
              work: c.work || "",
              rest: c.rest || "",
              effort: c.effort || "",
              notes: c.notes || ""
            };
          });
          return acc;
        }, {}),
        backCheck: st.backCheck,
        postSession: st.postSession,
        reflection: st.reflection,
        answers: (session.questions || []).reduce((acc, q, i) => {
          acc[q] = st.answers[`q${i}`] || "";
          return acc;
        }, {})
      };
    }

    function download(data){
      const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    dl.addEventListener("click", () => download(build()));

    saveBtn.addEventListener("click", async () => {
      const data = build();
      // History drives "last time" and must not depend on the upload working.
      history[keyFor(active)] = data;
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

      if(!configured){ download(data); return; }

      // Path follows the trained-on date. Changing that date after saving moves
      // the file rather than leaving two copies of the same session.
      const path = pathFor();
      const oldPath = st.savedPath && st.savedPath !== path ? st.savedPath : null;
      st.savedPath = path;
      enqueue({
        path,
        message: `${session.day || session.title} — ${blockName} week ${program.week}`,
        json: JSON.stringify(data, null, 2),
        savedAt: new Date().toISOString()
      });
      saveBtn.disabled = true;
      statusEl.textContent = "Saving to GitHub…";
      const res = await flushQueue();
      saveBtn.disabled = false;
      if(res.failed === 0){
        st.savedAt = new Date().toISOString();
        save();
        statusEl.textContent = `Saved to GitHub ${new Date(st.savedAt).toLocaleTimeString("en-AU")}`;
        statusEl.classList.add("good");
        saveBtn.textContent = "Update saved session";
        if(oldPath){
          const gone = await deleteFile(sync.config, oldPath);
          if(gone.ok) draw();
          else alert(`Saved as ${path}, but the old file couldn't be removed.\n\n${gone.error}\n\nDelete ${oldPath} in GitHub so this session isn't stored twice.`);
        }
      }else{
        save();
        const advice = res.kind === "auth"
          ? "Fix the token under “Set up saving to GitHub” below — it uploads as soon as that works."
          : "It uploads automatically next time you open this page with a connection.";
        alert(`Saved on this device, but not uploaded.\n\n${res.error || ""}\n\n${advice}`);
        statusEl.textContent = "Saved on this device — upload pending";
      }
    });

    // Inside draw(), because draw() clears the page — appended outside, the
    // settings card disappears the first time anything re-renders.
    app.appendChild(syncCard());

    refreshProgress();
  }

  redraw = draw;
  draw();

  if(sync.config && sync.config.token && sync.queue.length){
    flushQueue().then(res => { if(res.pushed) draw(); });
  }
}

load();

if("serviceWorker" in navigator && window.isSecureContext){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
